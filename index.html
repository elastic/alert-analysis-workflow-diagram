<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Security Alert Analysis — Workflow</title>
<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script crossorigin src="https://unpkg.com/reactflow@11.11.4/dist/umd/index.js"></script>
<link rel="stylesheet" href="https://unpkg.com/reactflow@11.11.4/dist/style.css" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #070b14;
    --bg-2: #0a0f1b;
    --card: #101725;
    --card-hi: #151d2e;
    --border: rgba(125, 150, 195, 0.14);
    --border-hi: rgba(150, 180, 230, 0.32);
    --text: #f2f5fa;
    --dim: #9aa9c2;
    --faint: #5a687f;

    --accent: #4aa8ff;       /* single hero accent */
    --orange: #f98b6c;       /* eyebrows only */
    --pink: #ff5e9c;
    --cyan: #22d3c5;

    /* muted, cohesive step signal colors (used ONLY as small dot + bar) */
    --c-start: #34d399;
    --c-data:  #56c7d6;
    --c-http:  #4aa8ff;
    --c-es:    #e0a45c;
    --c-ai:    #a98bff;
    --c-flow:  #d8b24a;
    --c-sec:   #ec6a92;
    --c-log:   #7f90ac;
    --c-end:   #647089;

    --font: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, monospace;
  }
  * { box-sizing: border-box; }
  html, body, #root { margin: 0; height: 100%; width: 100%; background: var(--bg); color: var(--text);
    font-family: var(--font); -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }

  .app { display: grid; grid-template-columns: 1fr 460px; height: 100vh; }
  .canvas-wrap { position: relative; height: 100vh; overflow: hidden;
    background:
      radial-gradient(1200px 560px at 75% -10%, #101d34 0%, transparent 62%),
      radial-gradient(820px 520px at -2% 4%, #14112b 0%, transparent 58%),
      var(--bg); }

  .eyebrow { display: inline-flex; align-items: center; gap: 9px; font-size: 10px; font-weight: 800;
    letter-spacing: 2.4px; text-transform: uppercase; color: var(--orange); }
  .eyebrow::before { content: ''; width: 20px; height: 2px; background: var(--orange); border-radius: 2px; }

  /* header */
  .topbar { position: absolute; z-index: 6; top: 26px; left: 30px; right: 30px; display: flex; align-items: flex-start; gap: 18px; pointer-events: none; }
  .brand { pointer-events: auto; display: flex; align-items: center; gap: 12px; }
  .brand .swirl { width: 24px; height: 24px; }
  .brand .wm { font-size: 14px; font-weight: 700; color: #fff; }
  .divider { width: 1px; height: 34px; background: var(--border); margin-top: 2px; }
  .titleblock { pointer-events: auto; }
  .titleblock .eyebrow { margin-bottom: 8px; }
  .titleblock h1 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.7px; line-height: 1; }
  .titleblock h1 .grad { background: linear-gradient(90deg, var(--pink), var(--cyan)); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
  .titleblock .desc { margin-top: 7px; font-size: 12.5px; color: var(--faint); max-width: 460px; line-height: 1.5; }

  .legend { pointer-events: auto; margin-left: auto; display: grid; grid-template-columns: 1fr 1fr; gap: 6px 18px;
    background: rgba(10,15,27,.66); padding: 13px 17px; border: 1px solid var(--border); border-radius: 16px;
    backdrop-filter: blur(18px) saturate(140%); box-shadow: 0 12px 40px rgba(0,0,0,.5); }
  .legend .cap { grid-column: 1 / -1; margin-bottom: 2px; }
  .legend .i { display: flex; align-items: center; gap: 9px; font-size: 11px; color: var(--dim); font-weight: 500; }
  .legend .sw { width: 7px; height: 7px; border-radius: 50%; box-shadow: 0 0 10px currentColor; }

  /* phase band label rendered as an RF node */
  .phase-band { pointer-events: none; }
  .phase-band .label { display: inline-flex; align-items: center; gap: 10px; font-size: 11px; font-weight: 800;
    letter-spacing: 2px; text-transform: uppercase; color: var(--faint); white-space: nowrap; }
  .phase-band .label::before { content: ''; width: 26px; height: 1px; background: var(--border-hi); }
  .phase-band .num { display: inline-grid; place-items: center; width: 20px; height: 20px; border-radius: 6px;
    font-size: 10px; font-weight: 800; color: var(--accent); background: rgba(74,168,255,.1); border: 1px solid rgba(74,168,255,.28); letter-spacing: 0; }

  /* NODES — clean, neutral, confident */
  .wf-node { position: relative; width: 270px; border-radius: 14px; cursor: pointer; overflow: hidden;
    background: var(--card); border: 1px solid var(--border);
    box-shadow: 0 10px 30px rgba(0,0,0,.4);
    transition: transform .15s cubic-bezier(.2,.7,.3,1), box-shadow .15s, border-color .15s, background .15s; }
  .wf-node::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 3px; background: var(--nc); }
  .wf-node .pad { padding: 15px 17px 15px 19px; }
  .wf-node:hover { transform: translateY(-2px); background: var(--card-hi); border-color: var(--border-hi); box-shadow: 0 18px 44px rgba(0,0,0,.55); }
  .wf-node.sel { border-color: var(--nc); background: var(--card-hi); box-shadow: 0 0 0 1.5px var(--nc), 0 18px 46px rgba(0,0,0,.55); }

  .wf-node .kicker { display: flex; align-items: center; gap: 8px; margin-bottom: 9px; }
  .wf-node .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--nc); box-shadow: 0 0 9px var(--nc); }
  .wf-node .type { font-size: 9.5px; font-weight: 800; letter-spacing: 1.6px; text-transform: uppercase; color: var(--nc); }
  .wf-node .nm { font-size: 15px; font-weight: 700; line-height: 1.3; letter-spacing: -0.25px; color: #f5f8fc; }
  .wf-node .kd { font-size: 10.5px; color: var(--faint); font-family: var(--mono); margin-top: 8px; }
  .wf-node.n-start, .wf-node.n-end { width: 228px; background: var(--bg-2); }
  .wf-node.n-start .nm, .wf-node.n-end .nm { font-size: 13.5px; }

  /* DETAIL PANEL */
  .detail { background: linear-gradient(180deg, var(--bg-2), var(--bg)); border-left: 1px solid var(--border); padding: 34px 32px 64px; overflow-y: auto; height: 100vh; }
  .detail::-webkit-scrollbar { width: 8px; } .detail::-webkit-scrollbar-thumb { background: #1a2338; border-radius: 8px; }
  .empty { display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%; text-align: center; color: var(--faint); }
  .empty .ring { width: 62px; height: 62px; border-radius: 50%; border: 1.5px dashed var(--border-hi); display: grid; place-items: center; font-size: 24px; margin-bottom: 18px; opacity: .7; }
  .empty .t { font-size: 15px; font-weight: 700; color: var(--dim); }
  .empty .s { font-size: 13px; margin-top: 6px; line-height: 1.6; max-width: 240px; }

  .d-eyebrow { margin-bottom: 14px; color: var(--nc); }
  .d-eyebrow::before { background: var(--nc); }
  .d-title { font-size: 27px; font-weight: 800; margin: 0 0 13px; letter-spacing: -0.8px; line-height: 1.1; }
  .kind-chip { display: inline-block; font-family: var(--mono); font-size: 11px; padding: 5px 11px; border-radius: 8px;
    background: rgba(0,0,0,.35); border: 1px solid var(--border); color: var(--dim); }

  .sec { margin-top: 28px; }
  .sec h4 { font-size: 10px; text-transform: uppercase; letter-spacing: 1.8px; margin: 0 0 10px; font-weight: 800; color: var(--orange); }
  .sec p { margin: 0; color: #c6d1e2; line-height: 1.75; font-size: 15px; }
  .why { background: rgba(34,211,197,.055); border: 1px solid rgba(34,211,197,.2); border-radius: 14px; padding: 16px 18px; }
  .why h4 { color: var(--cyan); }
  .why p { color: #d0efeb; }

  .io { margin-top: 2px; }
  .io .r { display: flex; align-items: baseline; gap: 11px; padding: 10px 0; border-bottom: 1px solid var(--border); font-family: var(--mono); font-size: 12px; color: #cbd6e8; }
  .io .r:last-child { border-bottom: none; }
  .io .r .ar { color: var(--nc); font-family: var(--font); font-weight: 800; font-size: 13px; }

  .tags { display: flex; flex-wrap: wrap; gap: 8px; }
  .tag { font-size: 10px; font-weight: 700; letter-spacing: 1px; text-transform: uppercase; padding: 5px 11px; border-radius: 7px;
    border: 1px solid var(--border); color: var(--dim); background: rgba(255,255,255,.015); }

  .react-flow__attribution { display: none; }
  .react-flow__controls { border-radius: 12px; overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,.55); border: 1px solid var(--border); }
  .react-flow__controls-button { background: #0c1220; border-bottom: 1px solid var(--border); color: var(--dim); width: 30px; height: 30px; }
  .react-flow__controls-button:hover { background: #131c2e; }
  .react-flow__controls-button svg { fill: var(--dim); }
  .react-flow__minimap { border-radius: 12px; overflow: hidden; box-shadow: 0 12px 30px rgba(0,0,0,.55); border: 1px solid var(--border); }
  .react-flow__edge-text { font-family: var(--font); font-weight: 700; }

  @media (max-width: 1120px){ .app{grid-template-columns:1fr;} .detail{display:none;} .legend{display:none;} }
</style>
</head>
<body>
<div id="root"></div>
<script src="workflow_diagram_data.js"></script>
<script src="workflow_diagram_app.js"></script>
</body>
</html>
